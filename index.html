<style>
:root{
  --bg:#05080d; --panel:#0b1118; --card:#0f1620; --card2:#0a0f15; --line:#1b2532; --line2:#2a3647; --line3:#36465b; --text:#dfe6ef; --soft:#b9c4d2; --soft2:#c9d2de; --mute:#7f8b9c;
  --up:#1fcf8f; --down:#f0605d; --gold:#f5c542; --blue:#4c9aff; --purple:#b388ff; --orange:#ff9f43; --aqua:#22d3ee;
  --chart:#020407; --hdr:rgba(5,8,13,.92); --veil:rgba(5,8,13,.75); --on-gold:#1b1505; --on-up:#03140d;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#f3f5f9; --panel:#eef2f7; --card:#ffffff; --card2:#f7f9fc; --line:#dde3ec; --line2:#c9d2de; --line3:#b7c2d1; --text:#131a26; --soft:#3d4757; --soft2:#2c3646; --mute:#5d6879;
  --up:#087f5b; --down:#c62f2c; --gold:#946200; --blue:#1a66c9; --purple:#7445cc; --orange:#b45000; --aqua:#00838f;
  --chart:#ffffff; --hdr:rgba(243,245,249,.92); --veil:rgba(255,255,255,.85); --on-gold:#ffffff; --on-up:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;flex:none}
.brand{white-space:nowrap;font-family:var(--mono);font-weight:800;letter-spacing:.06em;font-size:15px;line-height:1.15}
.brand small{display:block;color:var(--mute);font-weight:500;font-size:11px;letter-spacing:.12em}
.theme{margin-left:auto;display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.theme button{border:0;background:none;color:var(--mute);font-family:var(--mono);font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px;min-height:32px}
.theme button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.theme button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.prog{margin-left:12px;font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
.bar{width:110px;height:5px;background:var(--line);border-radius:9px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--up),var(--gold));width:0;transition:width .4s}
main{display:grid;grid-template-columns:330px 1fr;max-width:1280px;margin:0 auto;min-height:calc(100vh - 60px)}
#nav{border-right:1px solid var(--line);padding:14px 12px 40px;height:calc(100vh - 60px);overflow:auto;position:sticky;top:60px}
#search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none}
#search:focus{border-color:var(--gold)}
.cat{margin:18px 4px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px 8px;margin:2px 0}
.item:hover{background:var(--card)}
.item.on{background:var(--card);border-color:var(--line2)}
.item .ic{width:36px;height:36px;flex:none;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.box b{color:var(--text)}
.item b{display:block;font-size:14.5px;font-weight:600}
.item span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.item .ok{margin-left:auto;color:var(--up);font-size:14px;opacity:0}
.item.seen .ok{opacity:1}
#view{padding:18px 22px 60px;min-width:0}
.back{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:14px;margin-bottom:12px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
h1{font-family:var(--mono);font-weight:800;letter-spacing:.03em;font-size:clamp(24px,4.4vw,36px);margin:4px 0 4px;text-transform:uppercase}
.lead{color:var(--soft);margin:0 0 14px;font-size:15.5px;line-height:1.5;max-width:760px}
.player{background:var(--chart);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:900px}
.cwrap{position:relative;cursor:pointer}
canvas{display:block;width:100%}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.overlay div{background:var(--veil);border:1px solid var(--line2);border-radius:999px;padding:12px 18px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em}
.caption{padding:12px 16px 4px;min-height:74px;border-top:1px solid var(--line)}
.caption .no{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.14em}
.caption p{margin:5px 0 0;font-size:15.5px;line-height:1.45;transition:opacity .25s}
.ctrl{display:flex;align-items:center;gap:8px;padding:8px 12px 12px}
.cb{background:var(--card);border:1px solid var(--line);border-radius:9px;min-width:40px;height:38px;padding:0 10px;font-family:var(--mono);font-size:14px;font-weight:700}
.cb:hover{border-color:var(--line3)}
#seek{flex:1;accent-color:var(--down);height:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 14px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.done{color:var(--text)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px;max-width:900px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.box p,.box li{font-size:14.5px;line-height:1.5;color:var(--soft2);margin:0}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.box.g h3{color:var(--up)}.box.y h3{color:var(--gold)}.box.b h3{color:var(--blue)}.box.r h3{color:var(--down)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px;max-width:900px}
.pn button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:14px}
.pn button:last-child{text-align:right}
.pn small{display:block;color:var(--mute);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;margin-bottom:3px}
.pn button:disabled{opacity:.35;cursor:default}
.disc{color:var(--mute);font-size:12px;margin-top:22px;max-width:900px}
.home{max-width:900px}
.home .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left}
.tile:hover{border-color:var(--line3)}
.tile b{display:block;font-family:var(--mono);font-size:14px;letter-spacing:.05em;text-transform:uppercase;margin:10px 0 4px}
.tile span{color:var(--mute);font-size:13px}
.quizbtn{background:var(--card);border-color:var(--line2) !important;margin-top:12px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:760px}
.qbar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.qbar i{display:block;height:100%;background:var(--gold)}
.qq{font-size:18px;font-weight:700;line-height:1.4;margin:0 0 12px}
.qcv{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:#020407}
.opts{display:grid;gap:8px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--line3)}
.opt.ok{border-color:var(--up);background:rgba(31,207,143,.12)}
.opt.bad{border-color:var(--down);background:rgba(240,96,93,.12)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.5}
.fb b{font-family:var(--mono)}
.qnav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qnav button{flex:1;min-width:140px;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--panel)}
.qnav .main{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.score{font-family:var(--mono);font-size:54px;font-weight:800;margin:6px 0}
.calc{margin-top:12px;max-width:900px}
.calc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0 12px}
.calc label{font-size:12px;color:var(--mute);font-family:var(--mono);letter-spacing:.06em}
.calc input{width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px}
.calc .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc .res div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.calc .res span{display:block;font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.calc .res b{font-family:var(--mono);font-size:18px}
.bigtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:18px}
.big{position:relative;overflow:hidden;text-align:left;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-height:168px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.big:hover{transform:translateY(-2px);border-color:var(--acc)}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
.big::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%)}
.big .bi{position:absolute;right:14px;top:16px;opacity:.95}
.big h2{font-family:var(--mono);font-weight:800;font-size:clamp(17px,1.6vw + 6px,21px);letter-spacing:.03em;text-transform:uppercase;margin:0 70px 8px 0;line-height:1.2;color:var(--acc)}
.big p{margin:0 0 14px;color:var(--soft);font-size:14.5px;line-height:1.45;max-width:85%}
.big .ft{margin-top:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.big .pb{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}.big .pb i{display:block;height:100%;background:var(--acc)}
.big .go{color:var(--acc);font-size:16px;font-weight:800}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px}
.lc{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lc:hover{border-color:var(--acc)}
.lc canvas.th{width:88px;height:55px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--chart)}
.lc .ic{width:48px;height:48px;flex:none;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.lc small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.lc b{display:block;font-size:16px;margin:2px 0}
.lc span{display:block;font-size:13px;color:var(--mute)}
.lc .ok{margin-left:auto;color:var(--up);font-size:18px}
.start{margin-top:16px;background:var(--up);color:var(--on-up);border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  #nav{position:static;height:auto;border-right:0;padding:12px 14px 40px}
  #view{padding:14px 12px 50px}
  #nav{display:none}
  .bar{width:70px}
  .theme button .tl{display:none}
  .theme button{padding:6px 9px}
  .brand small{display:none}
  .brand{font-size:13.5px}
  header{gap:9px;padding:12px 12px}
  .prog{margin-left:4px}
  .bar{width:56px}
}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 34 34"><rect width="34" height="34" rx="8" fill="#0f1620"/><g fill="none" stroke="#22d3ee" stroke-width="1.4"><ellipse cx="17" cy="17" rx="12" ry="4.6"/><ellipse cx="17" cy="17" rx="12" ry="4.6" transform="rotate(60 17 17)"/><ellipse cx="17" cy="17" rx="12" ry="4.6" transform="rotate(-60 17 17)"/></g><circle cx="17" cy="17" r="2.8" fill="#f5c542"/></svg>
  <div class="brand" style="cursor:pointer" onclick="location.hash=''">PHYSIK-SCHULE<small>BAYAZIT · PHYSIK IM ALLTAG</small></div>
  <div class="theme" role="group" aria-label="Darstellung"><button data-m="dark" title="Dunkel">☾<span class="tl"> Dunkel</span></button><button data-m="light" title="Hell">☀<span class="tl"> Hell</span></button><button data-m="auto" title="Automatisch">◐<span class="tl"> Auto</span></button></div>
  <div class="prog"><span id="progtxt">0 / 0</span><div class="bar"><i id="progbar"></i></div></div>
</header>
<main>
  <nav id="nav">
    <input id="search" placeholder="Lektion suchen … z. B. Strom" autocomplete="off" aria-label="Lektion suchen">
    <div id="list"></div>
  </nav>
  <section id="view"></section>
</main>
<script>
"use strict";
/* ============ Farben & Helfer ============ */
const VW=400,VH=250;
const THEMES={
 dark:{bg:'#020407',grid:'#111a24',axis:'#6f7b8c',text:'#e6ecf3',mute:'#7f8b9c',line:'#1b2532',line2:'#2a3647',
  up:'#1fcf8f',down:'#f0605d',gold:'#f5c542',blue:'#4c9aff',purple:'#b388ff',orange:'#ff9f43',aqua:'#22d3ee',pink:'#ff6fae',
  pillBg:'rgba(2,4,7,.9)',metal:'#9aa7b8',metal2:'#6b7889',metal3:'#4a5565',metalHi:'#d5dde8',block:'#121a24',blockLine:'#3a4859',head:'#18222e',
  air:'#4c9aff',fuel:'#22d3ee',fire:'#ff7a1a',fire2:'#ffd23f',exhaust:'#8b95a3',oil:'#f5a623',water:'#38bdf8',hot:'#f0605d',cold:'#4c9aff',
  carBody:'#141d28',carLine:'#5b6b80',road:'#0d141c',roadLine:'#3a4859',batt:'#1fcf8f',outline:'#020407',glass:'rgba(76,154,255,.15)'},
 light:{bg:'#ffffff',grid:'#eef1f5',axis:'#5d6879',text:'#131a26',mute:'#5d6879',line:'#dde3ec',line2:'#c9d2de',
  up:'#087f5b',down:'#c62f2c',gold:'#946200',blue:'#1a66c9',purple:'#7445cc',orange:'#b45000',aqua:'#00838f',pink:'#c2185b',
  pillBg:'rgba(255,255,255,.95)',metal:'#8793a3',metal2:'#5f6b7b',metal3:'#465160',metalHi:'#c4ccd7',block:'#eef2f7',blockLine:'#8a96a8',head:'#e2e8f0',
  air:'#1a66c9',fuel:'#00838f',fire:'#e8590c',fire2:'#f59f00',exhaust:'#6b7280',oil:'#b45000',water:'#0284c7',hot:'#c62f2c',cold:'#1a66c9',
  carBody:'#f1f4f8',carLine:'#7d8899',road:'#e9edf2',roadLine:'#b7c2d1',batt:'#087f5b',outline:'#ffffff',glass:'rgba(26,102,201,.1)'}};
const C=Object.assign({},THEMES.dark);
function setCanvasTheme(t){Object.assign(C,THEMES[t]||THEMES.dark);}
const MONO="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace";
const SANS="'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;};
const lerp=(a,b,f)=>a+(b-a)*f;
const TAU=Math.PI*2,rad=d=>d*Math.PI/180;
const deN=(x,d=0)=>x.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
function hexA(hex,a){if(hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const G={nolabel:false};
/* Sichtbarkeit: Element erscheint ab Schritt k */
function ap(st,k,f=3){if(st.s>k)return 1;if(st.s<k)return 0;return clamp(st.p*f);}
function only(st,k,f=4){if(st.s!==k)return 0;return clamp(Math.min(st.p*f,(1-st.p)*f+.6));}

function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function box(g,x,y,w,h,fill,stroke,r=6,lw=1.4){rr(g,x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke();}}
function circ(g,x,y,r,fill,stroke,lw=1.4){g.beginPath();g.arc(x,y,r,0,TAU);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke();}}
function line(g,x1,y1,x2,y2,col,lw=1.5,dash){g.save();g.strokeStyle=col;g.lineWidth=lw;if(dash)g.setLineDash(dash);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore();}
function poly(g,pts,fill,stroke,lw=1.4,close=true){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));if(close)g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke();}}
function txt(g,x,y,s,col,size=11,align='center',weight=700,font=MONO){g.font=`${weight} ${size}px ${font}`;g.fillStyle=col;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function arrowHead(g,x1,y1,x2,y2,col,s=7){const a=Math.atan2(y2-y1,x2-x1);g.fillStyle=col;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-s*Math.cos(a-.45),y2-s*Math.sin(a-.45));g.lineTo(x2-s*Math.cos(a+.45),y2-s*Math.sin(a+.45));g.closePath();g.fill();}
function arrow(g,x1,y1,x2,y2,col,lw=2,a=1,both=false){if(a<=0)return;g.save();g.globalAlpha*=a;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();const ang=Math.atan2(y2-y1,x2-x1),k=lw*2;g.moveTo(x1+(both?Math.cos(ang)*k:0),y1+(both?Math.sin(ang)*k:0));g.lineTo(x2-Math.cos(ang)*k,y2-Math.sin(ang)*k);g.stroke();arrowHead(g,x1,y1,x2,y2,col,5+lw*1.5);if(both)arrowHead(g,x2,y2,x1,y1,col,5+lw*1.5);g.restore();}
/* Beschriftungs-Pille */
function pill(g,x,y,text,col,a=1,align='center',size=11){
 if(a<=0||G.nolabel)return;g.save();g.globalAlpha*=a;g.font=`700 ${size}px ${MONO}`;
 const w=g.measureText(text).width+12,h=size+8;let x0=align==='center'?x-w/2:align==='left'?x:x-w;
 x0=Math.max(2,Math.min(VW-w-2,x0));const y0=y-h/2;
 g.fillStyle=C.pillBg;rr(g,x0,y0,w,h,5);g.fill();g.strokeStyle=col;g.lineWidth=1.2;g.stroke();
 g.fillStyle=col;g.textBaseline='middle';g.textAlign='left';g.fillText(text,x0+6,y+.5);g.restore();
}
/* Pille mit Hinweislinie zu einem Punkt */
function tag(g,px,py,x,y,text,col,a=1,align='center'){if(a<=0||G.nolabel)return;g.save();g.globalAlpha*=a;g.strokeStyle=col;g.lineWidth=1;g.setLineDash([3,3]);g.beginPath();g.moveTo(px,py);g.lineTo(x,y);g.stroke();g.setLineDash([]);circ(g,px,py,2.6,col);g.restore();pill(g,x,y,text,col,a,align);}
/* Titel-Pille oben links (Phase) */
function head(g,text,col,a=1){pill(g,8,15,text,col,a,'left',11.5);}
/* Punkte entlang eines Pfades bewegen */
function pathLen(pts){let L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return L;}
function pathAt(pts,L,d){const tot=L[L.length-1];d=((d%tot)+tot)%tot;let i=1;while(i<L.length-1&&L[i]<d)i++;const f=(d-L[i-1])/((L[i]-L[i-1])||1);return[lerp(pts[i-1][0],pts[i][0],f),lerp(pts[i-1][1],pts[i][1],f)];}
function flow(g,pts,t,col,o={}){const L=pathLen(pts),tot=L[L.length-1],gap=o.gap||16,sp=o.speed||.05,r=o.r||2.4;g.save();g.globalAlpha*=(o.a==null?1:o.a);g.fillStyle=col;
 for(let d=0;d<tot;d+=gap){const dd=d+t*sp;if(o.limit!=null&&((dd%tot)+tot)%tot>o.limit*tot)continue;const p=pathAt(pts,L,dd);g.beginPath();g.arc(p[0],p[1],r,0,TAU);g.fill();}g.restore();}
function pipe(g,pts,col,w=8,a=1){g.save();g.globalAlpha*=a;g.strokeStyle=col;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.restore();}
/* Zahnrad (außen) */
function gear(g,x,y,r,z,ang,fill,stroke,o={}){const d=o.depth||Math.max(3,r*.12);g.beginPath();
 for(let k=0;k<z;k++){const a0=ang+k*TAU/z,w=TAU/z;const pts=[[a0-w*.5,r-d],[a0-w*.28,r+d*.9],[a0+w*.0,r+d],[a0+w*.28,r+d*.9]];
  // Zahnmitte bei a0
  const seq=[[a0-w*.5,r-d],[a0-w*.3,r-d],[a0-w*.18,r+d],[a0+w*.18,r+d],[a0+w*.3,r-d],[a0+w*.5,r-d]];
  seq.forEach((p,i)=>{const X=x+Math.cos(p[0])*p[1],Y=y+Math.sin(p[0])*p[1];(k===0&&i===0)?g.moveTo(X,Y):g.lineTo(X,Y);});}
 g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=stroke;g.lineWidth=o.lw||1.4;g.stroke();
 if(o.hub!==false){circ(g,x,y,Math.max(3,r*.22),C.bg,stroke,1.2);}
 if(o.mark){const mr=r*.62;circ(g,x+Math.cos(ang)*mr,y+Math.sin(ang)*mr,Math.max(2.5,r*.09),o.mark);}
}
/* Hohlrad (Innenverzahnung) */
function ringGear(g,x,y,r,R,z,ang,fill,stroke,o={}){const d=o.depth||Math.max(3,r*.06);g.beginPath();g.arc(x,y,R,0,TAU);
 for(let k=z-1;k>=0;k--){const a0=ang+k*TAU/z,w=TAU/z;const seq=[[a0+w*.5,r+d],[a0+w*.3,r+d],[a0+w*.18,r-d],[a0-w*.18,r-d],[a0-w*.3,r+d],[a0-w*.5,r+d]];
  seq.forEach((p,i)=>{const X=x+Math.cos(p[0])*p[1],Y=y+Math.sin(p[0])*p[1];(k===z-1&&i===0)?g.moveTo(X,Y):g.lineTo(X,Y);});}
 g.closePath();g.fillStyle=fill;g.fill('evenodd');g.strokeStyle=stroke;g.lineWidth=1.4;g.stroke();
 if(o.mark){const mr=(r+R)/2;circ(g,x+Math.cos(ang)*mr,y+Math.sin(ang)*mr,3,o.mark);}
}
/* Diagramm-Achsen */
function axes(g,x0,y0,w,h,xl,yl,xt,yt,a=1){g.save();g.globalAlpha*=a;
 g.strokeStyle=C.grid;g.lineWidth=1;(yt||[]).forEach(v=>{const y=y0-v[0]*h;g.beginPath();g.moveTo(x0,y);g.lineTo(x0+w,y);g.stroke();txt(g,x0-4,y,v[1],C.axis,9,'right',500);});
 (xt||[]).forEach(v=>{const x=x0+v[0]*w;txt(g,x,y0+9,v[1],C.axis,9,'center',500);});
 g.strokeStyle=C.axis;g.lineWidth=1.3;g.beginPath();g.moveTo(x0,y0-h);g.lineTo(x0,y0);g.lineTo(x0+w,y0);g.stroke();
 txt(g,x0+w,y0+21,xl,C.mute,9.5,'right',700);txt(g,x0+2,y0-h-9,yl,C.mute,9.5,'left',700);g.restore();}
function plot(g,fn,x0,y0,w,h,col,lw=2.5,upto=1,a=1){g.save();g.globalAlpha*=a;g.strokeStyle=col;g.lineWidth=lw;g.lineJoin='round';g.beginPath();const n=120;let first=true;
 for(let i=0;i<=n*upto;i++){const u=i/n,v=fn(u);if(v==null){first=true;continue;}const X=x0+u*w,Y=y0-v*h;first?g.moveTo(X,Y):g.lineTo(X,Y);first=false;}g.stroke();g.restore();}
/* Integral (für Drehwinkel bei variabler Geschwindigkeit) */
function integ(f,T,n=60){let s=0;for(let i=0;i<n;i++)s+=f((i+.5)/n*T)*T/n;return s;}

function rng(seed){let s=seed%2147483647||1;for(let k=0;k<6;k++)s=s*16807%2147483647;return()=>{s=s*16807%2147483647;return(s-1)/2147483646;};}

  else{const vx=Math.cos(P.a),vy=Math.sin(P.a),sp=.05*(1+P.r1);let X=P.r1*(w-20)+vx*t*sp,Y=P.r2*(h-20)+vy*t*sp;const W=w-20,H=h-20;X=((X%(2*W))+2*W)%(2*W);if(X>W)X=2*W-X;Y=((Y%(2*H))+2*H)%(2*H);if(Y>H)Y=2*H-Y;px=x+10+X;py=y+10+Y;}

const P={L:null,t:0,playing:false,speed:1,cv:null,ctx:null,W:0,H:0,dirty:true,last:0,stepIdx:-1,tl:null};
function buildTL(L){let t=0;const steps=L.steps.map(s=>{const o={t,d:s.d,text:s.text};t+=s.d;return o;});return{steps,total:t};}
function stAt(tl,t){let s=0;tl.steps.forEach((x,i)=>{if(t>=x.t)s=i;});const S=tl.steps[s];const T=Math.min(t-S.t,S.d);return{s,p:clamp(T/S.d),T,t,d:S.d};}
function render(ctx,W,H,L,st){ctx.setTransform(1,0,0,1,0,0);const dpr=ctx._dpr||1;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
 const sc=Math.min(W/VW,H/VH);ctx.translate((W-VW*sc)/2,(H-VH*sc)/2);ctx.scale(sc,sc);ctx.lineCap='butt';ctx.lineJoin='miter';
 try{L.draw(ctx,st);}catch(e){console.error(L.id,e);}
}
function staticFrame(cv,L,s,p,w,h,nolabel){const dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';const ctx=cv.getContext('2d');ctx._dpr=dpr;
 const tl=buildTL(L);s=Math.min(s,tl.steps.length-1);const S=tl.steps[s];const t=S.t+S.d*p;G.nolabel=!!nolabel;render(ctx,w,h,L,stAt(tl,t));G.nolabel=false;}

 document.getElementById('play').onclick=togglePlay;document.getElementById('cwrap').onclick=togglePlay;
 document.getElementById('restart').onclick=()=>{P.t=0;P.playing=true;P.dirty=true;updBtn();};
 const sp=document.getElementById('speed');sp.textContent=(P.speed===.5?'½':P.speed)+'×';
 sp.onclick=e=>{P.speed=P.speed===1?2:P.speed===2?.5:1;e.currentTarget.textContent=(P.speed===.5?'½':P.speed)+'×';};
 document.getElementById('chips').innerHTML=P.tl.steps.map((s,i)=>`<button class="chip" data-i="${i}">${i+1}</button>`).join('');
 document.getElementById('chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;P.t=P.tl.steps[+c.dataset.i].t+1;P.playing=true;P.dirty=true;updBtn();};
 resize();updBtn();renderList();window.scrollTo(0,0);
}
function togglePlay(){if(!P.L)return;if(P.t>=P.tl.total){P.t=0;P.playing=true;}else P.playing=!P.playing;P.dirty=true;updBtn();}
function updBtn(){const b=document.getElementById('play');if(!b)return;b.textContent=P.playing?'❚❚':(P.t>=P.tl.total?'⟲':'▶');
 const o=document.getElementById('ovl');const end=P.t>=P.tl.total;o.classList.toggle('show',!P.playing);document.getElementById('ovltxt').textContent=end?'⟲ NOCHMAL ANSEHEN':'▶ WEITER';}
function resize(){if(!P.cv)return;const w=P.cv.parentElement.clientWidth;const h=Math.round(clamp(w*.625,210,520));
 const dpr=window.devicePixelRatio||1;P.cv.width=w*dpr;P.cv.height=h*dpr;P.cv.style.height=h+'px';P.ctx._dpr=dpr;P.W=w;P.H=h;P.dirty=true;}
window.addEventListener('resize',()=>{resize();const qc=document.getElementById('qcv');if(qc&&Q&&Q.list[Q.i])drawQuizPic();});

/* ============ Startseite & Bereich ============ */
function showHome(){
 current=null;P.L=null;P.cv=null;
 const tiles=Object.keys(CATS).map(ck=>{const ls=LESSONS.filter(l=>l.cat===ck),n=ls.length,sn=ls.filter(l=>seen[l.id]).length,ci=CATINFO[ck];
  return `<button class="big" data-h="kat-${ck}" style="--acc:${ci.acc};--glow:${hexA(ci.hex,.16)}"><div class="bi">${catIcon(ck)}</div><h2>${CATS[ck]}</h2><p>${ci.d}</p><div class="ft"><span>${n} LEKTIONEN</span><div class="pb"><i style="width:${sn/n*100}%"></i></div><span>${sn}/${n}</span><span class="go">›</span></div></button>`;}).join('');
 const quiz=`<button class="big" data-h="quiz" style="--acc:var(--gold);--glow:rgba(245,197,66,.14)"><div class="bi" style="font-size:46px;line-height:1">🎯</div><h2>Quiz</h2><p>Teste dein Wissen: 10 zufällige Fragen mit Bildern und Rechenaufgaben.</p><div class="ft"><span>${best?`BESTWERT ${best}/10`:'NOCH NICHT GESPIELT'}</span><span style="flex:1"></span><span class="go">›</span></div></button>`;
 view.innerHTML=`<div class="home"><div class="kicker">Willkommen</div><h1>Physik im Alltag</h1>
 <p class="lead">Jede Lektion ist ein kleines Video: Bewegung, Energie, Wärme, Strom, Magnetismus, Schall und Licht bauen sich Schritt für Schritt auf und werden erklärt – mit Rechenbeispielen aus dem Alltag.</p>
 <div class="bigtiles">${tiles}${quiz}</div></div>`;
 view.querySelectorAll('.big').forEach(t=>t.onclick=()=>location.hash=t.dataset.h);
 renderList();window.scrollTo(0,0);
}
function showCat(ck){
 if(!CATS[ck]){showHome();return;}current=null;P.L=null;P.cv=null;
 const ls=LESSONS.filter(l=>l.cat===ck),ci=CATINFO[ck];
 view.innerHTML=`<div class="home" style="--acc:${ci.acc}"><button class="back" id="back">‹ Startseite</button>
 <div class="kicker">${ls.length} Lektionen · ${ls.filter(l=>seen[l.id]).length} gesehen</div><h1 style="color:${ci.acc}">${CATS[ck]}</h1><p class="lead">${ci.d}</p>
 <div class="lcards">${ls.map((l,i)=>`<button class="lc" data-id="${l.id}"><canvas class="th" data-id="${l.id}"></canvas><div><small>LEKTION ${i+1}</small><b>${l.title}</b><span>${l.sub}</span></div>${seen[l.id]?'<div class="ok">✓</div>':''}</button>`).join('')}</div></div>`;
 document.getElementById('back').onclick=()=>{location.hash='';};
 view.querySelectorAll('.lc').forEach(b=>b.onclick=()=>location.hash=b.dataset.id);
 drawThumbs();renderList();window.scrollTo(0,0);
}
function drawThumbs(){view.querySelectorAll('canvas.th').forEach(cv=>{const L=LESSONS.find(l=>l.id===cv.dataset.id);staticFrame(cv,L,L.thumb!=null?L.thumb:L.steps.length-1,.7,88,55,true);});}

/* ============ Quiz ============ */
const TQ=TQ_F,PQ=PQ_F;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let Q=null;
function startQuiz(){
 current=null;P.L=null;P.cv=null;
 const seenPic=new Set();const pics=shuffle(PQ.slice()).filter(x=>{const k=x.l+x.q;if(seenPic.has(x.l))return false;seenPic.add(x.l);return true;}).slice(0,4).map(x=>({pic:x,q:x.q,opts:shuffle(x.a.slice()),ans:x.a[0],e:x.e,l:x.l}));
 const txt=shuffle(TQ.slice()).slice(0,10-pics.length).map(x=>({q:x.q,opts:shuffle(x.a.slice()),ans:x.a[0],e:x.e,l:x.l}));
 Q={list:shuffle([...pics,...txt]),i:0,score:0,wrong:[]};renderList();renderQ();
}
function drawQuizPic(){const it=Q.list[Q.i],cv=document.getElementById('qcv');if(!cv||!it.pic)return;const L=LESSONS.find(l=>l.id===it.pic.l);const w=cv.parentElement.clientWidth,h=Math.round(clamp(w*.625,200,420));staticFrame(cv,L,it.pic.s,it.pic.p,w,h,true);}
function renderQ(){
 const it=Q.list[Q.i],n=Q.list.length;
 view.innerHTML=`<button class="back" id="back">‹ Startseite</button>
 <div class="kicker">Quiz · Frage ${Q.i+1} von ${n} · ${Q.score} richtig</div><h1>Teste dein Wissen</h1>
 <div class="qcard"><div class="qbar"><i style="width:${Q.i/n*100}%"></i></div>
 <p class="qq">${it.q}</p>${it.pic?'<div class="qcv"><canvas id="qcv"></canvas></div>':''}
 <div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${String.fromCharCode(65+k)}) ${o}</button>`).join('')}</div>
 <div id="fb"></div></div>`;
 document.getElementById('back').onclick=()=>{location.hash='';};
 if(it.pic)drawQuizPic();
 view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));window.scrollTo(0,0);
}
function answer(k){
 const it=Q.list[Q.i],ok=it.opts[k]===it.ans;if(ok)Q.score++;else Q.wrong.push(it.l);
 view.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(it.opts[j]===it.ans)b.classList.add('ok');else if(j===k)b.classList.add('bad');});
 const last=Q.i===Q.list.length-1,L=LESSONS.find(x=>x.id===it.l);
 document.getElementById('fb').innerHTML=`<div class="fb"><b style="color:${ok?'var(--up)':'var(--down)'}">${ok?'✓ RICHTIG!':'✗ LEIDER FALSCH'}</b>${ok?'':` – richtig ist: <b>${it.ans}</b>`}<br>${it.e}</div>
 <div class="qnav"><button id="tol">📖 Lektion: ${L?L.title:''}</button><button class="main" id="nx">${last?'Ergebnis ansehen':'Weiter ›'}</button></div>`;
 document.getElementById('tol').onclick=()=>location.hash=it.l;
 document.getElementById('nx').onclick=()=>{if(last)renderResult();else{Q.i++;renderQ();}};
 document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderResult(){
 const n=Q.list.length,sc=Q.score;if(sc>best){best=sc;try{localStorage.setItem(KEY+'-best',best)}catch(e){}}renderList();
 const msg=sc===n?'Perfekt! Du bist ein echter Physik-Profi. 🏆':sc>=8?'Sehr stark! Fast alles richtig. 💪':sc>=5?'Gut! Ein paar Lektionen kannst du noch wiederholen.':'Nicht schlimm – schau dir die Lektionen unten nochmal an und versuch es erneut.';
 const rep=[...new Set(Q.wrong)].map(id=>LESSONS.find(l=>l.id===id)).filter(Boolean);
 view.innerHTML=`<button class="back" id="back">‹ Startseite</button><div class="kicker">Quiz · Ergebnis</div><h1>Geschafft!</h1>
 <div class="qcard"><div class="score" style="color:${sc>=8?'var(--up)':sc>=5?'var(--gold)':'var(--down)'}">${sc} / ${n}</div><p style="font-size:16px;margin:0 0 6px">${msg}</p>
 <p style="color:var(--mute);font-family:var(--mono);font-size:12px;margin:0">BESTWERT: ${best} / ${n}</p>
 ${rep.length?`<p style="margin:16px 0 6px;font-weight:700">Diese Lektionen solltest du wiederholen:</p><div class="opts">${rep.map(l=>`<button class="opt" data-id="${l.id}">📖 ${l.title}</button>`).join('')}</div>`:''}
 <div class="qnav"><button id="home">Zur Übersicht</button><button class="main" id="again">🎯 Neues Quiz</button></div></div>`;
 document.getElementById('back').onclick=()=>{location.hash='';};
 view.querySelectorAll('.opt[data-id]').forEach(b=>b.onclick=()=>location.hash=b.dataset.id);
 document.getElementById('home').onclick=()=>{location.hash='';};
 document.getElementById('again').onclick=()=>{startQuiz();};
}

/* ---- Schleife ---- */
function frame(ts){
 const dt=P.last?Math.min(60,ts-P.last):0;P.last=ts;
 if(P.L&&P.cv){
  if(P.playing){P.t+=dt*P.speed;if(P.t>=P.tl.total){P.t=P.tl.total;P.playing=false;updBtn();markSeen(P.L.id);}P.dirty=true;}
  if(P.dirty){const st=stAt(P.tl,P.t);render(P.ctx,P.W,P.H,P.L,st);
   const sk=document.getElementById('seek');if(sk)sk.value=P.t;
   if(st.s!==P.stepIdx){P.stepIdx=st.s;const si=st.s,cp=document.getElementById('captxt');cp.style.opacity=0;setTimeout(()=>{cp.textContent=P.tl.steps[si].text;cp.style.opacity=1;},120);
    document.getElementById('stepno').textContent=`SCHRITT ${si+1} / ${P.tl.steps.length}`;
    document.querySelectorAll('.chip').forEach((c,i)=>{c.classList.toggle('on',i===si);c.classList.toggle('done',i<si);});}
   P.dirty=false;}
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{P.dirty=true;if(location.hash.startsWith('#kat-'))drawThumbs();});

/* ============ Hell/Dunkel ============ */
const mqLight=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
function themeMode(){try{return localStorage.getItem('kompass-theme')||'dark'}catch(e){return 'dark'}}
function applyTheme(m){const t=m==='auto'?(mqLight&&mqLight.matches?'light':'dark'):m;document.documentElement.setAttribute('data-theme',t);setCanvasTheme(t);
 document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));
 const mc=document.querySelector('meta[name=theme-color]');if(mc)mc.setAttribute('content',t==='light'?'#f3f5f9':'#05080d');
 P.dirty=true;if(document.querySelector('canvas.th'))drawThumbs();if(document.getElementById('qcv'))drawQuizPic();}
document.querySelectorAll('.theme button').forEach(b=>b.addEventListener('click',()=>{try{localStorage.setItem('kompass-theme',b.dataset.m)}catch(e){}applyTheme(b.dataset.m);}));
if(mqLight&&mqLight.addEventListener)mqLight.addEventListener('change',()=>{if(themeMode()==='auto')applyTheme('auto');});
applyTheme(themeMode());

function route(){const id=location.hash.slice(1);if(id==='quiz')startQuiz();else if(id.startsWith('kat-'))showCat(id.slice(4));else if(id)openLesson(id);else showHome();}
window.addEventListener('hashchange',route);
updProg();route();

</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
